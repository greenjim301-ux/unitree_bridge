# unitree_bridge_node 参数配置
# 通过 launch/unitree_bridge.launch 以 private (~) 命名空间加载

cmd_vel_topic: cmd_vel
network_interface: eth0 # 连接机器人 DDS 网络的网卡名，务必改成实际的网卡（比如 eno1/enp3s0/eth0）

sport_client_timeout_sec: 10.0 # unitree_sdk2 SportClient 自身的 RPC 超时

control_rate_hz: 20.0 # 控制循环频率，每个周期都重发 Move()/StopMove()，不是收到一次 cmd_vel 才发一次
cmd_timeout_sec: 0.5 # 超过这么久没收到新的 cmd_vel 就自动调用 StopMove()（安全看门狗）

max_vx: 0.75 # [m/s] 前后限幅，保守默认值，正式测试时按需要调
max_vy: 0.6 # [m/s] 左右限幅
max_vyaw: 1.0 # [rad/s] 转向角速度限幅

auto_stand_on_start: true # 节点启动时是否自动 RecoveryStand()（对起始姿态无要求，趴/蹲都能站起来）
stand_settle_sec: 3.0 # 发完 RecoveryStand() 后阻塞等待这么久再开始接收 cmd_vel，给站立留物理执行时间

# 站立完成后设置初始运动模式（在开始接收 cmd_vel 之前完成）
classic_walk_on_start: false # 不再切经典步态，站立后保持机器人默认的灵动（AI）步态
mode_settle_sec: 1.0 # 切完步态后阻塞等待这么久，给切换动作留出执行时间

# 步态切换的回读确认。SDK 的 SportClient 没有 ClassicWalkGet() 这类查询接口，
# 唯一的回读通道是下面这个 DDS 状态话题。按《运动服务接口 V2.0》文档，当前模式
# 是通过 SportModeState 的 error_code 字段回报的（"由于模式较多，采用该成员变量
# 反馈信息"），所以判定看 error_code，mode/gait_type 只作为诊断信息一起打印。
sport_state_topic: rt/sportmodestate # Go2 运动状态话题（部分机型是 rt/lf/sportmodestate）
state_wait_timeout_sec: 2.0 # 发完 ClassicWalk() 后等一帧新状态的超时
classic_walk_retry: 2 # 回读到模式不对时额外重发 ClassicWalk(true) 的次数
expected_mode: 2010 # 期望的 error_code(当前模式)：2010 = 经典。
  # 取值表来自《运动服务接口 V2.0》，常见值：1002 站立锁定 / 1013 平衡站立 /
  # 1015 常规行走 / 1016 常规跑步 / 1017 常规续航 / 2010 经典 / 2016 交叉步 /
  # 2017 直立（完整表在 CmdVelBridge.cpp 的 SportModeName 里）。
  # 注意这套模式号 != sport_api.hpp 的 API ID（ClassicWalk 的 API ID 是 2049）。
  # 设为 -1 可关掉校验，只打印实测值。
