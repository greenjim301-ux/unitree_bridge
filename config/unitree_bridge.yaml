# unitree_bridge_node 参数配置
# 通过 launch/unitree_bridge.launch 以 private (~) 命名空间加载

cmd_vel_topic: cmd_vel
network_interface: enp0s31f6 # 连接机器人 DDS 网络的网卡名，务必改成实际的网卡（比如 eno1/enp3s0/eth0）

sport_client_timeout_sec: 10.0 # unitree_sdk2 SportClient 自身的 RPC 超时

control_rate_hz: 20.0 # 控制循环频率，每个周期都重发 Move()/StopMove()，不是收到一次 cmd_vel 才发一次
cmd_timeout_sec: 0.5 # 超过这么久没收到新的 cmd_vel 就自动调用 StopMove()（安全看门狗）

max_vx: 0.75 # [m/s] 前后限幅，保守默认值，正式测试时按需要调
max_vy: 0.6 # [m/s] 左右限幅
max_vyaw: 1.0 # [rad/s] 转向角速度限幅

auto_stand_on_start: true # 节点启动时是否自动 RecoveryStand()（对起始姿态无要求，趴/蹲都能站起来）
stand_settle_sec: 3.0 # 发完 RecoveryStand() 后阻塞等待这么久再开始接收 cmd_vel，给站立留物理执行时间
